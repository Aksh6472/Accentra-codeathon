spring:
  application:
    name: leave-management
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:leave_management}
    username: ${DB_USERNAME:leave_user}
    password: ${DB_PASSWORD:leave_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Render (and most PaaS hosts) provide PORT; SERVER_PORT is kept for local overrides.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Business time zone used to decide "today" for leave dates. Empty = JVM default.
  time-zone: ${APP_TIMEZONE:}
  jwt:
    # Development-only fallback. Always set APP_JWT_SECRET outside local development.
    secret: ${APP_JWT_SECRET:ZGV2LW9ubHktbGVhdmUtbWFuYWdlbWVudC1qd3Qtc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uIQ==}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  workflow:
    # Initial values written to the workflow_settings table on first start; HR edits them afterwards.
    default-escalation-timeout-minutes: ${APP_ESCALATION_TIMEOUT_MINUTES:1440}
    default-team-absence-threshold-percent: ${APP_TEAM_ABSENCE_THRESHOLD_PERCENT:30}
  escalation:
    check-interval-ms: ${APP_ESCALATION_CHECK_INTERVAL_MS:60000}
    initial-delay-ms: ${APP_ESCALATION_INITIAL_DELAY_MS:15000}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    demo-password: ${APP_DEMO_PASSWORD:Demo@1234}
