# Production profile (activated by SPRING_PROFILES_ACTIVE=prod, set in the Dockerfile).
# Database settings come from DATABASE_URL (postgres://user:pass@host:port/db) or the DB_* variables;
# see DatabaseUrlEnvironmentPostProcessor.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

app:
  jwt:
    # Empty fallback: JwtService refuses to start without APP_JWT_SECRET, so the development key never reaches production.
    secret: ${APP_JWT_SECRET:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://accentra-codeathon.vercel.app,http://localhost:5173}
  seed:
    # Demo data only when explicitly requested. It is inserted once, into an empty database.
    enabled: ${APP_SEED_ENABLED:false}
