services:
  postgres:
    image: postgres:16-alpine
    container_name: leave-mgmt-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-leave_management}
      POSTGRES_USER: ${DB_USERNAME:-leave_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leave_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - leave_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-leave_user} -d ${DB_NAME:-leave_management}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leave_pgdata:
